# Included into every location block rather than set once at the server level.
#
# nginx does not merge add_header across levels: a location that declares any
# add_header of its own silently discards every add_header inherited from the
# server block. Both locations here set their own Cache-Control, so server-level
# security headers would never reach a browser. Including them is the fix; it is
# not duplication for its own sake.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# connect-src must allow https: and wss: because the API is a different origin in
# production and the realtime channel is a WebSocket rather than a fetch.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
