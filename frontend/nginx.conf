server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # Hashed filenames, so these can be cached indefinitely. index.html must not
    # be, or a returning visitor keeps loading an old bundle that references
    # assets which no longer exist.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The single most important line in this file. A share link opened directly
    # (/polls/abc123) is not a file on disk; without this fallback it 404s, and
    # the share link is the whole product.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
