# A worked deployment, as a Render blueprint.
#
# Render is used here because it supports long-lived WebSocket connections and
# managed Redis, which is the constraint that rules most platforms out — a
# serverless runtime billed per request cannot hold a socket open for the length
# of a poll. Fly.io and Railway work on the same terms.
#
# What this file does NOT provision is MongoDB: create a free MongoDB Atlas
# cluster and paste its connection string into MONGODB_URI, which is marked
# sync: false below so it is entered in the dashboard rather than committed.
#
# Full procedure, including what to check afterwards: docs/deployment.md

services:
  - type: web
    name: livepolling-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGODB_DATABASE
        value: livepolling
      - key: JWT_EXPIRES_IN
        value: 24h
      # Generated by Render and never seen by anyone, which is better than a
      # secret somebody chose and pasted into two places.
      - key: JWT_SECRET
        generateValue: true
      # Entered in the dashboard: an Atlas SRV string is a credential.
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          name: livepolling-redis
          type: redis
          property: connectionString
      # The static site's URL, filled in after the first deploy. This is both the
      # CORS allow-list and the WebSocket Origin check, so it must be the exact
      # origin — no trailing slash, right scheme.
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"

  - type: web
    name: livepolling-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
    routes:
      # Without this, a shared link opened directly (/polls/abc123) 404s, because
      # it is a client-side route and not a file. The share link is the product.
      - type: rewrite
        source: /*
        destination: /index.html

  - type: redis
    name: livepolling-redis
    plan: free
    # The application reaches Redis from inside Render's network only.
    ipAllowList: []
